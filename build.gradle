plugins {
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version "${javafx_plugins_version}"
}

allprojects {
    repositories {
        mavenCentral()
    }
}

application {
    mainClass = "${group_id}.${start_class}"
}

dependencies {
    implementation project(':ui')

    implementation "org.openjfx:javafx-controls:${javafx_dependency_version}"
    implementation "org.openjfx:javafx-fxml:${javafx_dependency_version}"
}

javafx {
    version = javafx_version
    modules = javafx_modules.split(',')
}

tasks.register('runApp', JavaExec) {
    group = 'application'
    description = 'Run the application with JavaFX support'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${group_id}.${start_class}"

    jvmArgs = [
            '--module-path', configurations.runtimeClasspath.asPath,
            '--add-modules', javafx_modules
    ] as List<String>
}

tasks.register('buildApp') {
    group = 'build'
    description = 'Build the application'
    dependsOn tasks.named('build')

    doLast {
        println "Build complete!"
    }
}
