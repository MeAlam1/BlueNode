plugins {
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version "${javafx_plugins_version}"
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:${junit_jupiter_version}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(java_version)
        }
    }

    sourceSets {
        test {
            java {
                srcDirs = ['src/test/java']
            }
        }
    }

    spotless {
        java {
            endWithNewline()
            indentWithSpaces()
            removeUnusedImports()
            toggleOffOn()
            eclipse('4.31').configFile rootProject.file('codeformat/formatter-config.xml')
            importOrder()

            custom 'jetbrainsNullable', { String fileContents ->
                fileContents.replace('javax.annotation.Nullable', 'org.jetbrains.annotations.Nullable')
            }

            bumpThisNumberIfACustomStepChanges(2)
        }
    }
}

application {
    mainClass = "${group_id}.${start_class}"
}

dependencies {
    implementation project(':ui')
}

tasks.register('runApp', JavaExec) {
    group = 'application'
    description = 'Run the application with JavaFX support'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${group_id}.${start_class}"

    jvmArgs = [
            '--module-path', configurations.runtimeClasspath.asPath,
            '--add-modules', javafx_modules
    ] as List<String>
}

tasks.register('buildApp') {
    group = 'build'
    description = 'Build the application'
    dependsOn tasks.named('build')

    doFirst {
        println "Building the application..."
    }

    doLast {
        println "Build complete!"
    }
}

tasks.register('rebuild') {
    group = 'build'
    description = 'Clean and rebuild the project'
    dependsOn 'clean', 'buildApp'

    doFirst {
        println "Cleaning the application..."
    }

    doLast {
        println "Clean and rebuild complete!"
    }
}
