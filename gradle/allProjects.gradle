allprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'

    group = "${group_id}"
    version = "${version}"

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:${junit_jupiter_version}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(java_version)
        }
    }

    sourceSets {
        test {
            java {
                srcDirs = ['src/test/java']
            }
        }
    }

    spotless {
        java {
            endWithNewline()
            leadingTabsToSpaces()
            removeUnusedImports()
            toggleOffOn()
            eclipse('4.31').configFile rootProject.file('codeformat/formatter-config.xml')
            importOrder()

            custom 'jetbrainsNullable', { String fileContents ->
                fileContents.replace('javax.annotation.Nullable', 'org.jetbrains.annotations.Nullable')
            }

            bumpThisNumberIfACustomStepChanges(2)
        }
    }
}
