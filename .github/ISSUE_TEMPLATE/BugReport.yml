name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for making a Bug Report! Please provide as much detail as possible to help us diagnose and resolve the issue.
  - type: checkboxes
    attributes:
      label: Bug Report rule checks (please read carefully)
      options:
        - label: "I have checked that my problem <a href='https://github.com/MeAlam1/BlueNode/issues' target='_blank'>is not already reported</a>"
          required: true
        - label: "I have checked that my problem <a href='https://github.com/MeAlam1/BlueNode/discussions/8' target='_blank'>is not a known bug</a>"
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: |
        Please describe the bug in as much detail as possible.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce this issue?
      description: Explain the steps to reproduce the bug. A clear description will help us find and fix the issue faster. If possible, include screenshots.
      placeholder: |
        Step 1:
        Step 2:
        Step 3:
        ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
  - type: textarea
    id: steps-already-taken
    attributes:
      label: Steps Already Taken
      description: What troubleshooting steps or workarounds have you attempted?
  - type: textarea
    id: logs-and-error-messages
    attributes:
      label: Logs and Error Messages
      description: Provide any relevant logs or error messages. This information helps us understand the issue better.
  - type: dropdown
    id: compiler
    attributes:
      label: Compiler
      description: Which Compiler are you using?
      options:
        - "Java Gradle"
        - "C# .NET"
    validations:
      required: true
  - type: input
    id: project-version
    attributes:
      label: BlueNode version
      description: Which version of BlueNode are you using when the bug occurred?
    validations:
      required: true
  - type: textarea
    id: which-mods
    attributes:
      label: Which  mods?
      description: List any mods you have installed. This can help us determine if there is an interaction with a mod.
  - type: input
    id: operating-system
    attributes:
      label: Operating System
      description: What operating system are you using?
    validations:
      required: true
  - type: textarea
    id: more-information
    attributes:
      label: More information
      description: Provide any additional information that might be relevant to the issue.
